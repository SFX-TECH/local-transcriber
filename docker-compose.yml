# Local Transcriber -- container orchestration.
#
#   docker compose up --build              # CPU image, default
#   docker compose --profile gpu up --build gpu   # optional GPU image
#
# Both services share one model-cache volume, so a model downloaded by either is
# reused by both and never re-downloaded. Transcripts are written to your local
# ./output folder. Only one service should run at a time (they share port 8765).

services:
  # CPU service (default). Works anywhere Docker runs, no GPU needed.
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-transcriber:cpu
    ports:
      - "8765:8765"
    volumes:
      - ./output:/app/output          # transcripts land in your local ./output
      - model-cache:/models           # Whisper models persist here, downloaded once
    environment:
      - HF_HOME=/models
    restart: unless-stopped

  # OPTIONAL GPU service. Needs the NVIDIA Container Toolkit on the host.
  # Start it explicitly:  docker compose --profile gpu up --build gpu
  gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: local-transcriber:gpu
    ports:
      - "8765:8765"
    volumes:
      - ./output:/app/output
      - model-cache:/models
    environment:
      - HF_HOME=/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Queue backend: the same Kubernetes topology (Redis broker, FastAPI queue
  # API, one Whisper worker) on plain Docker, sharing a data volume and the
  # model cache. This is an opt-in profile, so the default `docker compose up`
  # above still runs only the interactive app.
  #   docker compose --profile queue up --build
  # The API then answers on http://localhost:8001 (host 8001 maps to container
  # 8000, so it never clashes with a kubectl port-forward on 8000).
  redis:
    profiles: ["queue"]
    image: redis:7-alpine
    restart: unless-stopped

  api:
    profiles: ["queue"]
    build:
      context: .
      dockerfile: Dockerfile
    image: local-transcriber:cpu
    command: ["python", "-m", "uvicorn", "service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      - REDIS_HOST=redis
      - SHARED_DIR=/data
      - HF_HOME=/models
    volumes:
      - queue-data:/data
      - model-cache:/models
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    profiles: ["queue"]
    build:
      context: .
      dockerfile: Dockerfile
    image: local-transcriber:cpu
    command: ["python", "-m", "service.worker"]
    environment:
      - REDIS_HOST=redis
      - SHARED_DIR=/data
      - HF_HOME=/models
      - WORKER_POLL_TIMEOUT=5
    volumes:
      - queue-data:/data
      - model-cache:/models
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  model-cache:
  queue-data:
